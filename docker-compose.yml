name: spe_mini_project-1

services:
  server:
    image: ${CALCULATOR_IMAGE:-calculator:local}
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      SERVER_PORT: "8000"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    networks:
      - calculator

networks:
  calculator:
    driver: bridge
