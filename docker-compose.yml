name: spe_mini_project-1

services:
  server:
    image: ${CALCULATOR_IMAGE:-calculaor-service:local}
    container_name: calculator-service
    build: .
    environment:
      SERVER_PORT: "8000"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6
    networks:
      - calculator

  nginx:
    image: nginx:stable-alpine
    container_name: calculator-nginx
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - calculator

networks:
  calculator:
    driver: bridge
